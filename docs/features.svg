<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#f4e4b0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="800" y="110" text-anchor="middle" font-family="Impact, sans-serif" font-size="64" fill="#ffffff">FEATURES</text>
  <line x1="680" y1="135" x2="920" y2="135" stroke="#c41230" stroke-width="4"/>

  <!-- feature cards -->
  <g font-family="Arial, sans-serif">
    <!-- card 1 -->
    <rect x="180" y="200" width="400" height="420" rx="20" fill="#1a1a1a" stroke="#c41230" stroke-opacity="0.4"/>
    <circle cx="380" cy="290" r="34" fill="#c41230"/>
    <text x="380" y="304" text-anchor="middle" font-size="34" fill="#fff">🎬</text>
    <text x="380" y="360" text-anchor="middle" font-size="34" font-family="Impact" fill="#fff">3D CANVAS</text>
    <text x="380" y="400" text-anchor="middle" font-size="20" fill="#8b9bb4">React Three Fiber</text>
    <text x="380" y="440" text-anchor="middle" font-size="20" fill="#8b9bb4">floating posters</text>
    <text x="380" y="480" text-anchor="middle" font-size="20" fill="#8b9bb4">mouse-reactive scene</text>

    <!-- card 2 -->
    <rect x="600" y="200" width="400" height="420" rx="20" fill="#1a1a1a" stroke="#c9a84c" stroke-opacity="0.4"/>
    <circle cx="800" cy="290" r="34" fill="#c9a84c"/>
    <text x="800" y="304" text-anchor="middle" font-size="34" fill="#0a0a0a">📜</text>
    <text x="800" y="360" text-anchor="middle" font-size="34" font-family="Impact" fill="#fff">SCROLL CINEMA</text>
    <text x="800" y="400" text-anchor="middle" font-size="20" fill="#8b9bb4">GSAP ScrollTrigger</text>
    <text x="800" y="440" text-anchor="middle" font-size="20" fill="#8b9bb4">pinned hero 500vh</text>
    <text x="800" y="480" text-anchor="middle" font-size="20" fill="#8b9bb4">phased transitions</text>

    <!-- card 3 -->
    <rect x="1020" y="200" width="400" height="420" rx="20" fill="#1a1a1a" stroke="#c41230" stroke-opacity="0.4"/>
    <circle cx="1220" cy="290" r="34" fill="#c41230"/>
    <text x="1220" y="304" text-anchor="middle" font-size="34" fill="#fff">❤️</text>
    <text x="1220" y="360" text-anchor="middle" font-size="34" font-family="Impact" fill="#fff">COLLECTION</text>
    <text x="1220" y="400" text-anchor="middle" font-size="20" fill="#8b9bb4">Zustand + json-server</text>
    <text x="1220" y="440" text-anchor="middle" font-size="20" fill="#8b9bb4">favorites persistence</text>
    <text x="1220" y="480" text-anchor="middle" font-size="20" fill="#8b9bb4">water ripple UI</text>
  </g>

  <!-- bottom tag -->
  <text x="800" y="700" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#c9a84c" opacity="0.7">POWERED BY THE TMDB API</text>
</svg>
