<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">Mapa mental de CINE ANIMATIONS</title><desc id="desc">El programa reúne seis objetivos: descubrir historias, vivir una experiencia visual, elegir una función, construir un archivo personal, conectar datos y cuidar la calidad. El checkout es una demostración sin cobros.</desc>
<rect width="1400" height="840" rx="22" fill="#101116"/>
<g font-family="Arial, sans-serif"><text x="48" y="52" fill="#d6b975" font-size="12" letter-spacing="4">CINE ANIMATIONS / MAPA MENTAL</text><text x="48" y="105" fill="#f6f1e9" font-size="34" font-weight="700">Una experiencia. Seis dimensiones conectadas.</text>
<g fill="none" stroke="#796449" stroke-width="2"><path d="M540 389 C490 389 490 235 436 235"/><path d="M540 436 C490 436 490 445 436 445"/><path d="M540 483 C490 483 490 655 436 655"/><path d="M860 389 C910 389 910 235 964 235"/><path d="M860 436 C910 436 910 445 964 445"/><path d="M860 483 C910 483 910 655 964 655"/></g><g transform="translate(48 145)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">01</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">DESCUBRIR</text><text x="24" y="87" fill="#bcbcc6" font-size="16">Películas, series y personas</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Búsqueda, géneros y rankings</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Biografías, reparto y trailers</text></g><g transform="translate(48 355)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">02</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">VIVIR LA EXPERIENCIA</text><text x="24" y="87" fill="#bcbcc6" font-size="16">Fondos WebP + movimiento GSAP</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Carruseles, perspectiva y scroll</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Responsive y movimiento reducido</text></g><g transform="translate(48 565)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">03</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">ELEGIR UNA FUNCIÓN</text><text x="24" y="87" fill="#bcbcc6" font-size="16">Fecha, formato y precio en COP</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Asientos + retención de 10 minutos</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Reserva o compra demostrativa</text></g><g transform="translate(964 145)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">04</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">CONSTRUIR TU ARCHIVO</text><text x="24" y="87" fill="#bcbcc6" font-size="16">Favoritos y ver más tarde</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Listas de películas y series</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Cuenta, historial y entradas</text></g><g transform="translate(964 355)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">05</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">CONECTAR LOS DATOS</text><text x="24" y="87" fill="#bcbcc6" font-size="16">TMDB a través de un proxy</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Estado React + almacenamiento local</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Supabase: Auth, RLS y Realtime</text></g><g transform="translate(964 565)"><rect width="388" height="180" rx="16" fill="#191a21" stroke="#363642"/><rect x="22" y="22" width="38" height="32" rx="6" fill="#38272c"/><text x="41" y="44" text-anchor="middle" fill="#f3c76e" font-size="15">06</text><text x="75" y="44" fill="#f6f1e9" font-size="17" font-weight="700">CUIDAR LA CALIDAD</text><text x="24" y="87" fill="#bcbcc6" font-size="16">Vitest, Playwright y ESLint</text><text x="24" y="116" fill="#bcbcc6" font-size="16">Pruebas de escritorio, tablet y móvil</text><text x="24" y="145" fill="#bcbcc6" font-size="16">Features con destino a develop</text></g>
